# Build the standalone Windows .exe and Linux AppImage.
#
# - On a published GitHub release: builds from the release tag and attaches
#   both files to that release.
# - Manually (Actions tab > Standalone builds > Run workflow): builds from the
#   branch picked in "Use workflow from" (normally master); if "release_tag" is
#   set, attaches the files to that existing release, otherwise they are only
#   kept as workflow artifacts. This lets older releases, made before these
#   build scripts existed, get standalone builds too.

name: Standalone builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the files to (e.g. v0.2.0); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: write   # upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: packaging/build_exe.py
            files: dist/*.exe
          - os: ubuntu-22.04   # old glibc: the AppImage runs on newer distros too
            script: packaging/build_appimage.py
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release event: build the released tag. Manual run: build the
          # selected branch, whatever release the files are attached to.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries (bundled into the AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements.txt

      - name: Build
        run: python ${{ matrix.script }}

      # Run the built file: it opens, starts a Lunar Transfer game, returns
      # to the menu and quits with exit code 0. A missing DLL or library
      # shows an error dialog instead and never exits, hence the timeout.
      - name: Smoke test (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORBI2D_SMOKE_TEST: "1"
          ORBI2D_SMOKE_PAD: "1"            # controller support must be bundled
          ORBI2D_SMOKE_LOG: smoke.log      # the .exe has no console
        run: |
          $exe = (Get-Item dist\*.exe).FullName
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle  # keep the handle so ExitCode is available
          $finished = $p.WaitForExit(120000)
          if (Test-Path smoke.log) { Get-Content smoke.log }
          if (-not $finished) {
            Stop-Process -Id $p.Id -Force
            throw "smoke test timed out (error dialog or hang)"
          }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          Write-Host "smoke test passed"

      - name: Smoke test (AppImage)
        if: runner.os == 'Linux'
        env:
          ORBI2D_SMOKE_TEST: "1"
          ORBI2D_SMOKE_PAD: "1"            # controller support must be bundled
          QT_QPA_PLATFORM: offscreen       # no display on the runner
          APPIMAGE_EXTRACT_AND_RUN: "1"    # no FUSE on the runner
        run: |
          chmod +x dist/*.AppImage
          timeout 120 dist/*.AppImage
          echo "smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: orbi2d-${{ runner.os }}
          path: ${{ matrix.files }}

      - name: Attach to release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
