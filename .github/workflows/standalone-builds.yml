# Build the standalone Windows .exe and Linux AppImage.
#
# - On a published GitHub release: builds from the release tag and attaches
#   both files to that release.
# - Manually (Actions tab > Standalone builds > Run workflow): builds from the
#   chosen tag or branch; if "release_tag" is set, attaches the files to that
#   existing release, otherwise they are only kept as workflow artifacts.

name: Standalone builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the files to (e.g. v0.2.0); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: write   # upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: packaging/build_exe.py
            files: dist/*.exe
          - os: ubuntu-22.04   # old glibc: the AppImage runs on newer distros too
            script: packaging/build_appimage.py
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries (bundled into the AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements.txt

      - name: Build
        run: python ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: orbi2d-${{ runner.os }}
          path: ${{ matrix.files }}

      - name: Attach to release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
